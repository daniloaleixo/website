# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: minimal
  theme_night:
  font: sc
  font_size: L

# SEO

marketing:
  seo:
    site_type: SportsOrganization 
    sport: 'Capoeira' 
    local_business_type: ''
    org_name: 'Simplesmente Capoeira e.V.'
    description: 'Capoeira Berlin – Simplesmente Capoeira e.V. offers Afro-Brazilian movement, acrobatics, music and martial-arts training for beginners, adults, teenagers and kids in Schöneberg, Kreuzberg and Mitte. Your first month of training (Probetraining) is free!'
    twitter: ''
  analytics:
    google_analytics: 'G-94YS2N69JT'
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: 'p1iQvMbhdk_z998KsjN7IC_OSsiN-pxHzAw0CVPj3HQ'
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    block: sc_navbar
    align: r
    show_logo: true
    show_language: false
    show_day_night: false
    show_search: true
    highlight_active_link: false

# Site footer

footer:
  block: sc_footer
  copyright:
    notice: '© {year} Simplesmente Capoeira e.V. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006
  citation_style: apa
